<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<title>Control de Técnicos de Taller</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: tablero de taller — barra lateral fija con módulos, área de trabajo con tarjetas de datos y tablas densas */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --line:#d8dee5; --line-strong:#b9c3ce;
  --ink:#16202a; --ink-2:#4a5866; --ink-3:#74818e;
  --accent:#1d5fa8; --accent-ink:#ffffff; --accent-soft:#e3edf8;
  --side:#1b2733; --side-ink:#d6dee6; --side-ink-2:#8a9aab; --side-active:#2a3a4a;
  --ok:#1f8a4c; --ok-soft:#e2f4ea; --warn:#b7791f; --warn-soft:#fbf0dc; --bad:#c2372f; --bad-soft:#fbe5e3; --info:#5b5fc7; --info-soft:#ebebfa;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161c; --surface:#18212a; --surface-2:#1e2832; --line:#2b3743; --line-strong:#3c4a58;
  --ink:#e6ebf0; --ink-2:#a9b5c1; --ink-3:#7d8b99;
  --accent:#5c9be0; --accent-ink:#0c1620; --accent-soft:#1c2f44;
  --side:#0b1015; --side-ink:#d6dee6; --side-ink-2:#7f8e9d; --side-active:#1c2834;
  --ok:#4cc27f; --ok-soft:#173326; --warn:#e0a84a; --warn-soft:#3a2d16; --bad:#ef6b62; --bad-soft:#3d1c1a; --info:#9a9df0; --info-soft:#262747;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#18212a; --surface-2:#1e2832; --line:#2b3743; --line-strong:#3c4a58;
  --ink:#e6ebf0; --ink-2:#a9b5c1; --ink-3:#7d8b99;
  --accent:#5c9be0; --accent-ink:#0c1620; --accent-soft:#1c2f44;
  --side:#0b1015; --side-ink:#d6dee6; --side-ink-2:#7f8e9d; --side-active:#1c2834;
  --ok:#4cc27f; --ok-soft:#173326; --warn:#e0a84a; --warn-soft:#3a2d16; --bad:#ef6b62; --bad-soft:#3d1c1a; --info:#9a9df0; --info-soft:#262747;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:20px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);flex:none;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand-name{font-family:var(--font-display);font-size:16px;overflow-wrap:break-word;font-weight:700;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.brand-sub{font-size:12px;color:var(--side-ink-2)}
.logos{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:6px;padding:8px 10px}
.logos img{display:block;height:auto}
.logos .l-nimac{width:62%}.logos .l-foton{width:24%}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;color:var(--side-ink);text-decoration:none;font-weight:500;font-size:14.5px}
.nav a:hover{background:var(--side-active)}
.nav a.active{background:var(--side-active);box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.nav .num{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--side-ink-2)}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-ink-2);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.dot.local{background:var(--warn)}
main{min-width:0;padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.head h1{font-size:30px;text-transform:uppercase;letter-spacing:.03em}
.head p{margin:2px 0 0;color:var(--ink-2)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 8px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 9px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel h2{font-size:18px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;color:var(--ink-2)}
.panel h2 small{font-family:var(--font-body);text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink-3);font-size:13px;margin-left:6px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.kpi .val{font-family:var(--font-display);font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:18px;color:var(--ink-3);margin-left:2px}
.kpi .sub{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .val.name{font-size:24px;padding-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--surface-2)}
.ot{font-family:var(--font-mono);font-size:12.5px;font-weight:500;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:12px;font-weight:600;border:1px solid var(--line-strong);color:var(--ink-2);white-space:nowrap}
.muted{color:var(--ink-3)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar>i.warn{background:var(--warn)}.bar>i.bad{background:var(--bad)}.bar>i.low{background:var(--info)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input[type=search]{flex:1 1 220px}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);margin-bottom:14px;font-size:14px}
/* calendario */
.cal{display:grid;min-width:760px}
.cal .ch{background:var(--surface-2);padding:8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.cal .ch.today{color:var(--accent)}
.cal .rh{padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:center;gap:2px}
.cal .rh b{font-weight:600}
.cal .rh>span:last-child{font-size:12px;color:var(--ink-3)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;min-height:64px;display:flex;flex-direction:column;gap:4px;background:var(--surface);position:relative}
.cell.sat{background:var(--bad-soft)}
.cell.high{background:var(--warn-soft)}
.cell.off{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px)}
.cell.over{outline:2px dashed var(--accent);outline-offset:-3px}
.cell .h{position:absolute;right:5px;bottom:3px;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cell .libre{font-size:12px;color:var(--ink-3);font-style:italic}
.chip{display:flex;align-items:center;gap:5px;padding:3px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-strong);border-left:4px solid var(--c,var(--accent));font-size:12px;cursor:grab;line-height:1.25;min-width:0}
.chip:active{cursor:grabbing}
.chip .ot{font-size:11.5px}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.chip.fin{opacity:.6}
.chip.p-Alta{box-shadow:inset 0 -2px 0 var(--bad)}
.month{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));min-width:780px}
.month .md{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:104px;padding:4px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.month .md.out{background:var(--surface-2)}
.month .md .dn{font-size:12px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.month .md.today .dn{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line-strong)}
/* balanceo */
.sug{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.sug+.sug{margin-top:8px}
.sug .ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
.sug .ic.w{background:var(--warn-soft);color:var(--warn)}
.sug p{margin:0}
.sug .meta{font-size:13px;color:var(--ink-3);margin-top:2px}
.sug .act{margin-left:auto}
.alert{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;font-size:14px}
.alert.bad{background:var(--bad-soft)}.alert.warn{background:var(--warn-soft)}.alert.low{background:var(--info-soft)}
.alert+.alert{margin-top:6px}
.chart-box{position:relative;height:260px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--ink-3)}
.field input,.field select{width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
dialog{border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(10,16,22,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h3{font-size:21px;text-transform:uppercase;letter-spacing:.04em}
.dlg-b{padding:16px 18px;overflow:auto}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100vw - 32px)}
.rep-card{display:flex;flex-direction:column;gap:10px}
.rep-card p{margin:0;color:var(--ink-2);font-size:14px}
.rep-card .tools{margin-top:auto}
.note{font-size:13px;color:var(--ink-3);margin-top:8px}
.week-nav{display:flex;align-items:center;gap:6px}
.week-nav .lbl{font-weight:600;min-width:170px;text-align:center;font-variant-numeric:tabular-nums}
.tech-name{display:flex;align-items:center;gap:8px;font-weight:600}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none;background:var(--c)}
.loading{padding:60px;text-align:center;color:var(--ink-2)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;align-items:center;padding:8px 0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));gap:10px;overflow:visible}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
  .brand-name,.brand-sub,.side-foot,.side .logos{display:none}
  .m-logos{display:flex!important;margin-bottom:14px;max-width:340px}
  .brand{padding:0}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;min-width:0}
  .nav a{white-space:nowrap;padding:7px 9px}
  .nav a.active{box-shadow:inset 0 -3px 0 var(--accent)}
  .nav .num{display:none}
  .g2,.g3,.form-grid{grid-template-columns:1fr}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .head h1{font-size:25px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" id="brandMark"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></div>
      <div><div class="brand-name" id="brandName">Control de Taller</div><div class="brand-sub">Personal de mantenimiento</div></div>
    </div>
    <div class="logos" id="sideLogos"></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div id="modeInfo"></div><div id="syncInfo"></div></div>
  </aside>
  <main id="main" data-x="1"><div class="loading">Cargando datos del taller…</div></main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"><div class="dlg-h"><h3 id="dlgTitle"></h3><button class="btn ghost" value="cancel" type="submit" aria-label="Cerrar">✕</button></div><div class="dlg-b" id="dlgBody"></div><div class="dlg-f" id="dlgFoot"></div></form></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

const pd=s=>{if(!s)return null;const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};

/* ================= Persistencia (db compartida o navegador) ================= */
let DB=null;
const LS_KEY="ct_data_v1";
function lsLoad(){try{const v=localStorage.getItem(LS_KEY);return v?JSON.parse(v):null}catch(e){return null}}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify({tecnicos:S.tecnicos,ots:S.ots,config:S.config}))}catch(e){}}
function strip(o){const c={...o};delete c.id;return JSON.parse(JSON.stringify(c))}
async function dbTry(fn){try{return await fn()}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,400+Math.random()*600));return fn()}throw e}}
function dbErr(e){const c=e&&e.code;toast(c==="invalid_argument"?"No tienes permiso para modificar estos datos.":c==="quota_exceeded"?"Se alcanzó el límite de almacenamiento.":"No se pudo guardar. Intenta de nuevo.");console.warn(e)}
async function saveDoc(col,obj){
  if(S.mode==="supa")return supaUpsert(col,[obj]);
  if(S.mode==="db"){try{await dbTry(()=>DB.doc(col+"/"+obj.id).set(strip(obj)))}catch(e){dbErr(e);return false}return true}
  const arr=S[col];const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);lsSave();render();return true}
async function delDoc(col,id){
  if(S.mode==="supa"){const {error}=await SB.from(col).delete().eq("id",id);if(error){supaErr(error);return false}S[col]=S[col].filter(x=>x.id!==id);render();return true}
  if(S.mode==="db"){try{await dbTry(()=>DB.doc(col+"/"+id).delete())}catch(e){dbErr(e);return false}return true}
  S[col]=S[col].filter(x=>x.id!==id);lsSave();render();return true}
async function saveConfig(cfg){
  S.config=cfg;
  if(S.mode==="supa"){const {error}=await SB.from("config").upsert({id:"empresa",data:JSON.parse(JSON.stringify(cfg)),updated_at:new Date().toISOString()});if(error)supaErr(error);render();return}
  if(S.mode==="db"){try{await dbTry(()=>DB.doc("config/empresa").set(JSON.parse(JSON.stringify(cfg))))}catch(e){dbErr(e)}}else{lsSave();render()}}
async function saveMany(items){if(S.mode==="supa"){const g={};for(const[c,o]of items)(g[c]=g[c]||[]).push(o);for(const c in g)for(let i=0;i<g[c].length;i+=200)if(!await supaUpsert(c,g[c].slice(i,i+200)))return;return}for(const[c,o]of items){if(S.mode==="db"){try{await dbTry(()=>DB.doc(c+"/"+o.id).set(strip(o)))}catch(e){dbErr(e);return}}else{const arr=S[c];const i=arr.findIndex(x=>x.id===o.id);if(i>=0)arr[i]=o;else arr.push(o)}}if(S.mode!=="db"){lsSave();render()}}
async function deleteAll(){
  if(S.mode==="supa"){for(const t of["tecnicos","ots"]){const {error}=await SB.from(t).delete().neq("id","");if(error){supaErr(error);return}S[t]=[]}await saveConfig({...S.config,ejemplo:false});return}
  if(S.mode==="db"){for(const t of S.tecnicos)await DB.doc("tecnicos/"+t.id).delete().catch(()=>{});for(const o of S.ots)await DB.doc("ots/"+o.id).delete().catch(()=>{});await saveConfig({...S.config,ejemplo:false})}
  else{S.tecnicos=[];S.ots=[];S.config={...S.config,ejemplo:false};lsSave();render()}}

function startLocal(reason){
  S.mode="local";const d=lsLoad();
  if(d){S.tecnicos=d.tecnicos||[];S.ots=d.ots||[];S.config=d.config||{}}
  else{const s=buildSample(today());S.tecnicos=s.tecnicos;S.ots=s.ots;S.config=s.config;lsSave()}
  S.localReason=reason||"";render()}
async function init(){
  if(window.SUPA&&window.supabase){try{await initSupa()}catch(e){S.mode="supa-error";S.err=(e&&e.message)||String(e);render()}return}
  if(!window.claude||!window.claude.use){startLocal();return}
  let db=null;try{db=await window.claude.use("db")}catch(e){db=null}
  if(!db){startLocal("sin-db");return}
  DB=db;S.mode="db-loading";
  const timer=setTimeout(()=>{if(S.mode==="db-loading"){S.mode="db-timeout";render()}},10000);
  const done=()=>{if(S.ready.t&&S.ready.o&&S.ready.c&&S.mode!=="db"){clearTimeout(timer);S.mode="db"}render()};
  const onErr=e=>{console.warn(e);clearTimeout(timer);if(S.mode!=="db"){startLocal("error")}else toast("Se perdió la conexión con los datos compartidos. Recarga la página.")};
  DB.collection("tecnicos").onSnapshot(s=>{S.tecnicos=s.docs.map(d=>({id:d.id,...d.data()}));S.ready.t=true;done()},onErr);
  DB.collection("ots").onSnapshot(s=>{S.ots=s.docs.map(d=>({id:d.id,...d.data()}));S.ready.o=true;done()},onErr);
  DB.doc("config/empresa").onSnapshot(s=>{S.config=s.exists?s.data():{};S.ready.c=true;done()},onErr);
}


/* ---------- Supabase (versión web publicada) ---------- */
let SB=null,rT=null;
function scheduleRender(){clearTimeout(rT);rT=setTimeout(render,150)}
function supaErr(e){console.warn(e);toast(/JWT|auth|permission|policy|401|403/i.test((e&&(e.message||e.code))||"")?"Tu sesión no tiene permiso. Vuelve a iniciar sesión.":"No se pudo guardar: "+((e&&e.message)||"error de conexión"))}
async function initSupa(){
  SB=window.supabase.createClient(window.SUPA.url,window.SUPA.key);
  SB.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){S.mode="supa-login";render()}});
  const {data}=await SB.auth.getSession();
  if(!data||!data.session){S.mode="supa-login";render();return}
  await supaLoad()}
async function fetchAll(t){let out=[],f=0;for(;;){const {data,error}=await SB.from(t).select("id,data").range(f,f+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;f+=1000}return out.map(r=>({id:r.id,...(r.data||{})}))}
async function supaLoad(){
  S.mode="db-loading";render();
  try{const [t,o,c]=await Promise.all([fetchAll("tecnicos"),fetchAll("ots"),fetchAll("config")]);S.tecnicos=t;S.ots=o;const e=c.find(x=>x.id==="empresa");if(e){const{id,...r}=e;S.config=r}else S.config={};
    const u=await SB.auth.getUser();S.user=u.data&&u.data.user;S.mode="supa";render()}
  catch(e){console.warn(e);S.mode="supa-error";S.err=(e&&e.message)||String(e);render();return}
  SB.channel("taller").on("postgres_changes",{event:"*",schema:"public"},p=>{const tb=p.table;if(!["tecnicos","ots","config"].includes(tb))return;
    if(p.eventType==="DELETE"){const id=p.old&&p.old.id;if(tb!=="config")S[tb]=S[tb].filter(x=>x.id!==id)}
    else{const row={id:p.new.id,...(p.new.data||{})};if(tb==="config"){if(row.id==="empresa"){const{id,...r}=row;S.config=r}}else{const a=S[tb];const i=a.findIndex(x=>x.id===row.id);if(i>=0)a[i]=row;else a.push(row)}}
    scheduleRender()}).subscribe()}
async function supaUpsert(t,rows){const now=new Date().toISOString();const {error}=await SB.from(t).upsert(rows.map(o=>({id:o.id,data:strip(o),updated_at:now})));if(error){supaErr(error);return false}
  for(const o of rows){const a=S[t];const i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o)}render();return true}

/* ================= Cálculos ================= */
function otDays(ot){const a=pd(ot.inicio),b=pd(ot.fin)||a;if(!a)return[];const r=[];for(let d=new Date(a);d<=b;d=addDays(d,1)){if(d.getDay()!==0)r.push(ymd(d))}if(!r.length)r.push(ot.inicio);return r}
function hoursIn(ot,from,to,field){const days=otDays(ot);if(!days.length)return 0;const f=ymd(from),t=ymd(to);const c=days.filter(d=>d>=f&&d<=t).length;return (Number(ot[field])||0)*c/days.length}
function overlaps(ot,from,to){const f=ymd(from),t=ymd(to);return ot.inicio<=t&&(ot.fin||ot.inicio)>=f}
function hoursOnDay(techId,day){const s=ymd(day);let h=0;for(const o of S.ots){if(o.tecnicoId!==techId)continue;const d=otDays(o);if(d.includes(s))h+=(Number(o.horasEst)||0)/d.length}return h}
const capDay=t=>(Number(t.horasSemana)||48)/6;
function periodRange(kind,ref){ref=ref||today();
  if(kind==="semana"){const a=mondayOf(ref);return{from:a,to:addDays(a,6),label:"Semana del "+fmtShort(a)+" al "+fmtShort(addDays(a,6))+" de "+addDays(a,6).getFullYear()}}
  if(kind==="mes"){const a=new Date(ref.getFullYear(),ref.getMonth(),1);return{from:a,to:new Date(ref.getFullYear(),ref.getMonth()+1,0),label:MESES[a.getMonth()]+" "+a.getFullYear()}}
  const a=new Date(ref.getFullYear(),0,1);return{from:a,to:new Date(ref.getFullYear(),11,31),label:"Año "+a.getFullYear()}}
function shiftPeriod(kind,ref,dir){if(kind==="semana")return addDays(ref,7*dir);if(kind==="mes")return new Date(ref.getFullYear(),ref.getMonth()+dir,1);return new Date(ref.getFullYear()+dir,0,1)}
function techStats(t,from,to){
  const mine=S.ots.filter(o=>o.tecnicoId===t.id);
  const inP=mine.filter(o=>overlaps(o,from,to));
  let prog=0,trab=0,prod=0,improd=0;
  for(const o of inP){prog+=hoursIn(o,from,to,"horasEst");const r=hoursIn(o,from,to,"horasReales");trab+=r;if(o.facturable!==false)prod+=r;else improd+=r}
  const fF=ymd(from),fT=ymd(to);
  const fin=mine.filter(o=>o.estado==="Finalizado"&&(o.cierre||o.fin)>=fF&&(o.cierre||o.fin)<=fT);
  const se=fin.reduce((a,o)=>a+(Number(o.horasEst)||0),0),sr=fin.reduce((a,o)=>a+(Number(o.horasReales)||0),0);
  const weeks=Math.max(1,Math.round(((to-from)/864e5+1)/7));
  const cap=ausente(t.estado)?0:(Number(t.horasSemana)||48)*weeks;
  const aTiempo=fin.filter(o=>(o.cierre||o.fin)<=o.fin).length;
  return{t,actividades:inP.length,finalizadas:fin.length,prog,trab,prod,improd,cap,carga:cap?prog/cap*100:(prog>0?Infinity:0),efic:sr>0?se/sr*100:null,se,sr,aTiempo,abiertas:inP.filter(o=>o.estado!=="Finalizado").length}}
function allStats(from,to){return sortedTechs().map(t=>techStats(t,from,to))}
function cargaClass(c){return c>100?"bad":c>=90?"warn":c<50?"low":""}
function estadoTecPill(e){const m={"Disponible":"ok","En trabajo":"acc","Vacaciones":"info","Permiso":"warn","Capacitación":"info"};return`<span class="pill ${m[e]||""}">${esc(e)}</span>`}
function estadoOtPill(o){if(o.estado!=="Finalizado"&&o.fin&&o.fin<ymd(today()))return`<span class="pill bad">Atrasada</span>`;const m={"Pendiente":"warn","En Proceso":"acc","Finalizado":"ok"};return`<span class="pill ${m[o.estado]||""}">${esc(o.estado)}</span>`}
function prioPill(p){const m={"Alta":"bad","Media":"warn","Baja":""};return`<span class="pill ${m[p]||""}">${esc(p)}</span>`}
function techCell(id){const t=techById(id);if(!t)return'<span class="muted">Sin asignar</span>';return`<span class="tech-name"><span class="av" style="--c:${techColor(t.id)}">${esc(initials(t.nombre))}</span>${esc(t.nombre)}</span>`}

/* ================= Balanceo inteligente ================= */
function balance(from,to){
  const stats=allStats(from,to);const map=new Map(stats.map(s=>[s.t.id,{...s,load:s.prog}]));
  const alerts=[],moves=[];
  const loadPct=s=>s.cap?s.load/s.cap*100:(s.load>0?Infinity:0);
  for(const s of stats){
    if(ausente(s.t.estado)&&s.abiertas>0)alerts.push({k:"bad",txt:`${s.t.nombre} está en ${s.t.estado.toLowerCase()} y tiene ${s.abiertas} OT abierta${s.abiertas>1?"s":""} esta semana.`});
    else if(s.cap&&s.carga>100)alerts.push({k:"bad",txt:`Técnico sobrecargado: ${s.t.nombre} al ${pct(s.carga)} de su capacidad (${h1(s.prog)} h de ${h1(s.cap)} h).`});
    else if(s.cap&&s.carga>=90)alerts.push({k:"warn",txt:`${s.t.nombre} está cerca del límite (${pct(s.carga)}).`});
    else if(s.cap&&s.carga<50)alerts.push({k:"low",txt:`Técnico con poco trabajo: ${s.t.nombre} al ${pct(s.carga)} (${h1(s.cap-s.prog)} h libres).`});
  }
  const receivers=()=>[...map.values()].filter(s=>s.cap>0&&!ausente(s.t.estado));
  const movable=s=>S.ots.filter(o=>o.tecnicoId===s.t.id&&o.estado==="Pendiente"&&overlaps(o,from,to)&&!moves.some(m=>m.ot.id===o.id));
  const fit=(o,r)=>o.especialidad?(o.especialidad===r.t.especialidad?0:(r.t.especialidad==="Mecánica General"||r.t.especialidad==="Diagnóstico"?1:3)):1;
  // 1) OT de técnicos ausentes
  for(const s of map.values()){if(!ausente(s.t.estado))continue;
    for(const o of movable(s)){const h=hoursIn(o,from,to,"horasEst");const cands=receivers().map(r=>({r,score:fit(o,r)*40+loadPct({...r,load:r.load+h})})).sort((a,b)=>a.score-b.score);
      const best=cands[0];if(!best)continue;moves.push({ot:o,from:s.t,to:best.r.t,h,motivo:`${s.t.nombre} está en ${s.t.estado.toLowerCase()}`});s.load-=h;best.r.load+=h}}
  // 2) Equilibrar sobrecarga
  for(let guard=0;guard<12;guard++){
    const rs=receivers();if(rs.length<2)break;
    const over=rs.filter(s=>loadPct(s)>90).sort((a,b)=>loadPct(b)-loadPct(a))[0];if(!over)break;
    let best=null;
    for(const o of movable(over)){const h=hoursIn(o,from,to,"horasEst");
      for(const r of rs){if(r===over)continue;const f=fit(o,r);if(f>=3)continue;const nr=loadPct({...r,load:r.load+h});const no=loadPct({...over,load:over.load-h});if(nr>85)continue;
        const score=Math.abs(no-nr)+f*15+(o.prioridad==="Alta"?8:0);if(!best||score<best.score)best={o,r,h,score}}}
    if(!best)break;
    moves.push({ot:best.o,from:over.t,to:best.r.t,h:best.h,motivo:`equilibrar la carga semanal (${pct(loadPct(over))} → ${pct(loadPct({...over,load:over.load-best.h}))})`});
    over.load-=best.h;best.r.load+=best.h}
  // Resumen agrupado
  const groups={};for(const m of moves){const k=m.from.id+">"+m.to.id;(groups[k]=groups[k]||{from:m.from,to:m.to,n:0}).n++}
  const after=[...map.values()].map(s=>({t:s.t,antes:s.carga,despues:loadPct(s),cap:s.cap}));
  return{stats,alerts,moves,groups:Object.values(groups),after}}

function vCalendario(){

    ${sortedTechs().map(t=>{const wk=techStats(t,UI.week,addDays(UI.week,6));return`<div class="rh"><span class="tech-name"><span class="av" style="--c:${techColor(t.id)}">${esc(initials(t.nombre))}</span><b>${esc(t.nombre.split(" ")[0])}</b></span><span>${esc(t.especialidad)} · ${wk.cap?pct(wk.carga):esc(t.estado)}</span></div>`+
      days.map(d=>{const s=ymd(d);const its=S.ots.filter(o=>o.tecnicoId===t.id&&otDays(o).includes(s));const h=hoursOnDay(t.id,d);const cap=capDay(t);const cls=ausente(t.estado)?"off":h>cap?"sat":h>cap*.9?"high":"";

      <select id="calTech" aria-label="Filtrar técnico"><option value="">Todos los técnicos</option>${sortedTechs().map(t=>`<option value="${t.id}" ${UI.calTech===t.id?"selected":""}>${esc(t.nombre)}</option>`).join("")}</select>`;
    body=`<div class="tbl-wrap"><div class="month">${DIAS.map(d=>`<div class="ch" style="background:var(--surface-2);padding:8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--line);border-right:1px solid var(--line)">${d}</div>`).join("")}
    ${cells.map(d=>{const s=ymd(d);const its=S.ots.filter(o=>(!UI.calTech||o.tecnicoId===UI.calTech)&&otDays(o).includes(s));const show=its.slice(0,5);return`<div class="md ${d.getMonth()!==m.getMonth()?"out":""} ${s===td?"today":""}" data-drop-day="${s}" ${UI.calTech?`data-drop-tech="${UI.calTech}"`:""}><span class="dn">${d.getDate()}</span>${show.map(o=>chip(o,s)).join("")}${its.length>5?`<span class="muted" style="font-size:12px">+${its.length-5} más</span>`:""}</div>`}).join("")}</div></div>`;

AFTER.calendario=()=>{

/* ---------- Productividad ---------- */
function vProductividad(){
  const {from,to,label}=periodRange(UI.period,UI.periodRef);const st=allStats(from,to);
  const rank=st.slice().sort((a,b)=>(b.efic??-1)-(a.efic??-1));
  return head("Comparador de productividad",label,periodTools())+`
  <div class="grid g3">
    <div class="panel"><h2>Actividades por técnico</h2><div class="chart-box"><canvas id="cAct"></canvas></div></div>
    <div class="panel"><h2>Horas trabajadas</h2><div class="chart-box"><canvas id="cHT"></canvas></div></div>
    <div class="panel"><h2>Eficiencia</h2><div class="chart-box"><canvas id="cEf"></canvas></div></div>
  </div>
  <div class="panel" style="margin-top:14px"><h2>Ranking <small>Eficiencia (%) = (Horas estimadas ÷ Horas reales) × 100, sobre OT finalizadas</small></h2>
  <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Técnico</th><th>Especialidad</th><th class="n">OT finalizadas</th><th class="n">H. estimadas</th><th class="n">H. reales</th><th class="n">Eficiencia</th><th class="n">Cerradas a tiempo</th></tr></thead><tbody>
  ${rank.map((s,i)=>`<tr><td class="n">${i+1}</td><td>${techCell(s.t.id)}</td><td><span class="tag">${esc(s.t.especialidad)}</span></td><td class="n">${s.finalizadas}</td><td class="n">${h1(s.se)}</td><td class="n">${h1(s.sr)}</td><td class="n"><b style="color:${s.efic==null?"":s.efic>=90?"var(--ok)":s.efic>=75?"var(--warn)":"var(--bad)"}">${pct(s.efic)}</b></td><td class="n">${s.finalizadas?pct(s.aTiempo/s.finalizadas*100):"—"}</td></tr>`).join("")}
  </tbody></table></div><p class="note">Más de 100% significa que terminó en menos horas de las estimadas. Verde ≥ 90%, ámbar 75–89%, rojo menos de 75%.</p></div>`}
AFTER.productividad=()=>{const {from,to}=periodRange(UI.period,UI.periodRef);const st=allStats(from,to);const base=chartBase();const L=st.map(s=>s.t.nombre.split(" ")[0]);const C=st.map(s=>techColor(s.t.id));
  mkChart("cAct",{type:"bar",data:{labels:L,datasets:[{data:st.map(s=>s.finalizadas),backgroundColor:C,borderRadius:3}]},options:base});
  mkChart("cHT",{type:"bar",data:{labels:L,datasets:[{data:st.map(s=>+s.sr.toFixed(1)),backgroundColor:C,borderRadius:3}]},options:{...base,scales:{...base.scales,y:{...base.scales.y,ticks:{...base.scales.y.ticks,callback:v=>v+" h"}}}}});
  mkChart("cEf",{type:"bar",data:{labels:L,datasets:[{data:st.map(s=>s.efic==null?0:Math.round(s.efic)),backgroundColor:st.map(s=>s.efic==null?css("--line"):s.efic>=90?css("--ok"):s.efic>=75?css("--warn"):css("--bad")),borderRadius:3}]},options:{...base,scales:{...base.scales,y:{...base.scales.y,suggestedMax:110,ticks:{...base.scales.y.ticks,callback:v=>v+"%"}}}}})};

AFTER.ajustes=()=>{
  $("#cf_l").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,320/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);
    saveConfig({...S.config,logo:cv.toDataURL("image/png")}).then(()=>toast("Logo guardado"))};img.src=r.result};r.readAsDataURL(f)};
  $("#cf_imp").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tecnicos)||!Array.isArray(d.ots))throw 0;
    confirmDlg("Restaurar respaldo",`Se agregarán o reemplazarán ${d.tecnicos.length} técnicos y ${d.ots.length} OT con los del archivo.`,"Restaurar",async()=>{await saveMany([...d.tecnicos.map(t=>["tecnicos",t]),...d.ots.map(o=>["ots",o])]);if(d.config)await saveConfig({...d.config,ejemplo:false});toast("Respaldo restaurado")})}catch(_){toast("El archivo no es un respaldo válido.")}};r.readAsText(f)}};

/* ================= Diálogos ================= */
let dlgSubmit=null;
function openDlg(title,body,onOk,okLabel="Guardar",extraFoot=""){
  $("#dlgTitle").innerHTML=title;$("#dlgBody").innerHTML=body;
  $("#dlgFoot").innerHTML=`${extraFoot}<button type="submit" class="btn" value="cancel">Cancelar</button><button type="button" class="btn primary" id="dlgOk">${okLabel}</button>`;
  dlgSubmit=onOk;const d=$("#dlg");if(!d.open)d.showModal();
  $("#dlgOk").onclick=async()=>{$("#dlgOk").disabled=true;const ok=await dlgSubmit();if(ok!==false)d.close();else $("#dlgOk").disabled=false};
  $("#dlgFoot").querySelectorAll("[data-act]").forEach(b=>b.onclick=e=>{e.preventDefault();act(b)});
  const first=$("#dlgBody").querySelector("input,select");if(first)first.focus()}
function confirmDlg(title,msg,okLabel,fn){openDlg(esc(title),`<p style="margin:0">${esc(msg)}</p>`,async()=>{await fn();return true},okLabel)}

/* ================= Acciones ================= */
function bindCommon(){
  document.querySelectorAll("#main [data-act]").forEach(b=>b.onclick=e=>{if(b.tagName==="LABEL")return;e.preventDefault();act(b)});
  document.querySelectorAll("#main [data-seg]").forEach(sg=>sg.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(sg.dataset.seg==="period"){UI.period=b.dataset.v;UI.periodRef=today()}else UI.calView=b.dataset.v;saveUI();render()}))}
async function act(b){const a=b.dataset.act,id=b.dataset.id;
  switch(a){
  case"new-tec":return tecForm();
  case"edit-tec":return tecForm(techById(id));
  case"del-tec":{const t=techById(id);const n=S.ots.filter(o=>o.tecnicoId===id&&o.estado!=="Finalizado").length;
    return confirmDlg("Eliminar técnico",`¿Eliminar a ${t.nombre}?${n?` Sus ${n} OT abiertas quedarán sin asignar.`:""} Las OT finalizadas conservan su historial.`,"Eliminar",async()=>{await saveMany(S.ots.filter(o=>o.tecnicoId===id&&o.estado!=="Finalizado").map(o=>["ots",{...o,tecnicoId:""}]));await delDoc("tecnicos",id);toast("Técnico eliminado")})}
  case"new-ot":return otForm();
  case"edit-ot":return otForm(S.ots.find(o=>o.id===id));
  case"del-ot":{const o=S.ots.find(x=>x.id===id);return confirmDlg("Eliminar OT",`¿Eliminar la ${o.numero} (${o.cliente})? No se puede deshacer.`,"Eliminar",async()=>{await delDoc("ots",id);toast(`${o.numero} eliminada`)})}
  case"prev-week":UI.week=addDays(UI.week,-7);return render();
  case"next-week":UI.week=addDays(UI.week,7);return render();
  case"this-week":UI.week=mondayOf(today());return render();
  case"prev-month":UI.calMonth=new Date(UI.calMonth.getFullYear(),UI.calMonth.getMonth()-1,1);return render();
  case"next-month":UI.calMonth=new Date(UI.calMonth.getFullYear(),UI.calMonth.getMonth()+1,1);return render();
  case"prev-day":UI.calDay=addDays(UI.calDay,UI.calDay.getDay()===1?-2:-1);return render();
  case"next-day":UI.calDay=addDays(UI.calDay,UI.calDay.getDay()===6?2:1);return render();
  case"today-day":UI.calDay=today();return render();
  case"prev-period":UI.periodRef=shiftPeriod(UI.period,UI.periodRef,-1);return render();
  case"next-period":UI.periodRef=shiftPeriod(UI.period,UI.periodRef,1);return render();
  case"apply-move":return applyMoves([lastBalance.moves[+b.dataset.i]]);
  case"apply-all":return applyMoves(lastBalance.moves);
  case"clear-sample":return confirmDlg("Borrar datos de ejemplo","Se eliminarán todos los técnicos y OT de ejemplo para que cargues tu personal real.","Borrar y empezar",async()=>{await deleteAll();toast("Listo. Agrega tu primer técnico.");location.hash="tecnicos"});
  case"wipe":return confirmDlg("Borrar todos los datos","Se eliminarán todos los técnicos y todas las OT. Descarga un respaldo antes si lo necesitas.","Borrar todo",async()=>{await deleteAll();toast("Datos borrados")});
  case"load-sample":{const s=buildSample(today());await saveMany([...s.tecnicos.map(t=>["tecnicos",t]),...s.ots.map(o=>["ots",o])]);await saveConfig({...S.config,ejemplo:true,empresa:S.config.empresa||s.config.empresa});return toast("Datos de ejemplo cargados")}
  case"save-cfg":await saveConfig({...S.config,empresa:$("#cf_n").value.trim()});return toast("Ajustes guardados");
  case"del-logo":await saveConfig({...S.config,logo:""});return toast("Logo quitado");
  case"backup":return saveFile(`respaldo-taller-${ymd(today())}.json`,new Blob([JSON.stringify({tecnicos:S.tecnicos,ots:S.ots,config:S.config,fecha:new Date().toISOString()},null,1)],{type:"application/json"}));
  case"rep":return makeReport(b.dataset.k,b.dataset.f);
  }}

/* ================= Archivos ================= */
async function saveFile(filename,blob){
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){await dl.save({filename,data:blob});return}}}catch(e){if(e&&e.code==="declined")return;console.warn(e)}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function reportData(kind){
  if(kind==="semana"){const w=mondayOf(pd($("#rp_w").value)||UI.week);return{from:w,to:addDays(w,6),titulo:"Reporte semanal",periodo:`Semana del ${fmtD(ymd(w))} al ${fmtD(ymd(addDays(w,6)))}`,slug:"semanal-"+ymd(w)}}
  const [y,m]=($("#rp_m").value||ymd(today()).slice(0,7)).split("-").map(Number);const a=new Date(y,m-1,1),b=new Date(y,m,0);return{from:a,to:b,titulo:kind==="tec"?"Reporte individual":"Reporte mensual",periodo:MESES[m-1]+" "+y,slug:(kind==="tec"?"individual-":"mensual-")+y+"-"+pad(m)}}
function chartImage(cfg,w=900,h=380){if(!window.Chart)return null;const cv=document.createElement("canvas");cv.width=w;cv.height=h;const ctx=cv.getContext("2d");
  const ch=new Chart(ctx,{...cfg,options:{...cfg.options,responsive:false,animation:false,devicePixelRatio:1},plugins:[{id:"bg",beforeDraw:c=>{c.ctx.save();c.ctx.fillStyle="#fff";c.ctx.fillRect(0,0,c.width,c.height);c.ctx.restore()}}]});
  const url=cv.toDataURL("image/jpeg",0.9);ch.destroy();return url}
function pdfChartOpts(){return{plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:"#333",font:{size:20}}},y:{beginAtZero:true,grid:{color:"#ddd"},ticks:{color:"#333",font:{size:18}}}}}}
async function makeReport(kind,fmt){
  if(!window.XLSX&&fmt==="xlsx"||!window.jspdf&&fmt==="pdf"){toast("No se pudo cargar el generador de archivos. Revisa tu conexión.");return}
  const R=reportData(kind);const {from,to}=R;const empresa=S.config.empresa||"Taller";
  let techs=sortedTechs();if(kind==="tec"){const t=techById($("#rp_t").value);if(!t){toast("Primero agrega un técnico.");return}techs=[t]}
  const st=techs.map(t=>techStats(t,from,to));
  const ots=S.ots.filter(o=>overlaps(o,from,to)&&techs.some(t=>t.id===o.tecnicoId)).sort((a,b)=>(techById(a.tecnicoId)?.nombre||"").localeCompare(techById(b.tecnicoId)?.nombre||"")||a.inicio.localeCompare(b.inicio));
  const progRows=ots.map(o=>[techById(o.tecnicoId)?.nombre||"Sin asignar",o.numero,o.cliente,o.equipo,o.descripcion,o.prioridad,fmtD(o.inicio),fmtD(o.fin),+hoursIn(o,from,to,"horasEst").toFixed(1),+(Number(o.horasReales)||0).toFixed(1),o.estado]);
  const resRows=st.map(s=>[s.t.nombre,s.t.especialidad,s.actividades,s.finalizadas,+s.prog.toFixed(1),+s.trab.toFixed(1),+s.prod.toFixed(1),+s.improd.toFixed(1),s.cap?Math.round(s.carga):"—",s.efic==null?"—":Math.round(s.efic)]);
  const resHead=["Técnico","Especialidad","Actividades","Finalizadas","H. programadas","H. trabajadas","H. productivas","H. improductivas","Carga %","Eficiencia %"];
  const progHead=["Técnico","N° OT","Cliente","Equipo","Actividad","Prioridad","Inicio","Fin","Horas (periodo)","H. reales","Estado"];
  const fname=`reporte-${R.slug}${kind==="tec"?"-"+techs[0].nombre.split(" ")[0].toLowerCase():""}`.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9-]/gi,"");
  if(fmt==="xlsx"){const wb=XLSX.utils.book_new();
    const sh=(rows,cols)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=cols.map(w=>({wch:w}));return ws};
    const top=[[empresa],[R.titulo+" · "+R.periodo],["Generado: "+fmtD(ymd(today()))],[]];
    if(kind==="semana")XLSX.utils.book_append_sheet(wb,sh([...top,["Técnico","N° OT","Actividad","Horas"],...ots.map(o=>[techById(o.tecnicoId)?.nombre||"Sin asignar",o.numero,o.descripcion,+hoursIn(o,from,to,"horasEst").toFixed(1)])],[22,10,44,8]),"Programación semanal");
    if(kind!=="semana")XLSX.utils.book_append_sheet(wb,sh([...top,["Técnico","Actividades","Horas","Eficiencia %"],...st.map(s=>[s.t.nombre,s.finalizadas,+s.sr.toFixed(1),s.efic==null?"—":Math.round(s.efic)])],[22,12,10,12]),kind==="tec"?"Resumen":"Resumen mensual");
    XLSX.utils.book_append_sheet(wb,sh([...top,resHead,...resRows],[22,18,11,11,14,13,13,15,9,12]),"Indicadores");
    XLSX.utils.book_append_sheet(wb,sh([...top,progHead,...progRows],[22,10,22,22,40,9,11,11,14,9,12]),"Detalle de OT");
    const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
    await saveFile(fname+".xlsx",new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));return}
